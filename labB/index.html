<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adrian Romański (55806) - AI LAB B</title>
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
</head>
<body>
<main>
  <header><p>AI · LAB B</p><h1>Lista zadań</h1></header>
  <label for="search">Wyszukaj zadanie</label>
  <input id="search" type="search" placeholder="Wpisz co najmniej 2 znaki">
  <p id="counter" aria-live="polite"></p>
  <div id="tasks"></div>
  <section aria-labelledby="add-heading">
    <h2 id="add-heading">Nowe zadanie</h2>
    <form id="add-form">
      <label for="task-text">Treść zadania</label>
      <input id="task-text" required minlength="3" maxlength="255" placeholder="Co chcesz zrobić?">
      <label for="task-date">Termin (opcjonalnie)</label>
      <input id="task-date" type="datetime-local">
      <button type="submit">Dodaj zadanie</button>
    </form>
  </section>
  <p id="message" role="status"></p>
</main>
</body>
</html>
